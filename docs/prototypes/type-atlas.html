<style>
/* Layout: the map of Goa fills the screen and is made of village names; controls float top-left, the place panel docks right on desktop and rises from the bottom on phones. */
:root{

}

  --haldi:#E8B23A; --kokum:#E07A98; --rose:#E2869D; --green:#6CC2A6; --oxide:#E58A6E; --lilac:#B7AAE6; --sky:#6BC3D8; --neel:#8EA8EC; --mustard:#E9A458;

  --edge:#15130F; --water:#4F7F93; --quiet:#211E19; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#15130F; --paper-2:#211E19; --ink:#F3F0E8; --ink-2:#C9C3B8; --ink-3:#8C857A; --rule:#2E2A24;
  --haldi:#E8B23A; --kokum:#E07A98; --rose:#E2869D; --green:#6CC2A6; --oxide:#E58A6E; --lilac:#B7AAE6; --sky:#6BC3D8; --neel:#8EA8EC; --mustard:#E9A458;
  --t-haldi:#3A2E14; --t-kokum:#3A1B25; --t-rose:#3D262B; --t-green:#17302A; --t-oxide:#3A2219; --t-lilac:#2C2838; --t-sky:#173238; --t-neel:#1B2540; --t-mustard:#3A2814;
  --edge:#15130F; --water:#4F7F93; --quiet:#211E19; color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--display);overflow:hidden;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;touch-action:none;cursor:grab}
#stage.drag{cursor:grabbing}
svg{width:100%;height:100%;display:block}
.v{stroke:var(--edge);stroke-width:.6;vector-effect:non-scaling-stroke;transition:fill .35s,opacity .35s}
.t{fill:none;stroke:var(--ink);stroke-opacity:.35;stroke-width:1.2;vector-effect:non-scaling-stroke;pointer-events:none}
.lab{text-anchor:middle;dominant-baseline:central;font-variation-settings:"wdth" 75;font-weight:600;pointer-events:none;transition:opacity .3s,fill .3s}
.lab.faint{font-weight:300;}
.tl{text-anchor:middle;dominant-baseline:central;font-weight:800;font-variation-settings:"wdth" 82;pointer-events:none;fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round;transition:opacity .4s}
.sel{stroke:var(--ink);stroke-width:2.2}
.riv{fill:none;stroke:var(--water);stroke-linecap:round;stroke-linejoin:round;opacity:.75;pointer-events:none;transition:opacity .3s}
#gR{transition:opacity .3s}
.rl{fill:var(--water);font-weight:600;font-variation-settings:"wdth" 90;letter-spacing:.12em;pointer-events:none;transition:opacity .3s;paint-order:stroke;stroke:var(--paper);stroke-width:.5px}
#legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink-2);font-weight:600}
#legend:empty{display:none}
.key{display:inline-flex;align-items:center;gap:6px}.key i{width:14px;height:14px;border-radius:3px;display:inline-block}
#top{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px;pointer-events:none;max-width:560px}
#top>*{pointer-events:auto}
@media (min-width:900px){#top{left:max(14px,env(safe-area-inset-left,0px));top:14px;padding:14px 16px 16px;background:color-mix(in srgb,var(--paper) 90%,transparent);border-radius:16px;max-width:420px}}
.mark{display:flex;align-items:baseline;gap:8px;font-weight:700;font-size:18px}
.mark .d{font-family:var(--deva)}
.mark small{font-weight:500;font-size:12px;color:var(--ink-3)}
#lede{font-size:clamp(26px,4.4vw,46px);line-height:1.02;font-weight:750;font-variation-settings:"wdth" 80;letter-spacing:-.01em;text-wrap:balance;max-width:14ch;margin:0}
#count{font-size:15px;line-height:1.4;color:var(--ink-2);max-width:34ch;margin:0}
#count b{color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:6px}
.seg{align-self:flex-start;display:inline-flex;background:var(--paper-2);border:1px solid var(--rule);border-radius:10px;padding:3px}
.seg button,.chip{font:inherit;font-size:14px;font-weight:600;border:0;background:none;color:var(--ink-2);padding:7px 12px;border-radius:7px;cursor:pointer;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button .d{font-family:var(--deva)}
.chip{background:var(--paper-2);border:1px solid var(--rule);border-radius:999px;padding:6px 12px;display:inline-flex;gap:6px;align-items:baseline}
.chip span{font-weight:500;color:var(--ink-3);font-size:12px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip[aria-pressed="true"] span{color:var(--paper);opacity:.7}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.lbl{font-size:12px;color:var(--ink-3);font-weight:600;align-self:center;margin-right:2px}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--ink);color:var(--paper);font-size:13px;font-weight:600;padding:9px 14px;border-radius:999px;white-space:nowrap;transition:opacity .4s}
#panel{position:fixed;background:var(--paper-2);border:1px solid var(--rule);box-shadow:0 18px 50px rgba(22,18,12,.16);overflow:auto;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
@media (min-width:900px){#panel{top:14px;right:max(14px,env(safe-area-inset-right,0px));bottom:14px;width:380px;border-radius:18px;transform:translateX(420px)}#panel.open{transform:none}}
@media (max-width:899px){#panel{left:0;right:0;bottom:0;max-height:58%;border-radius:18px 18px 0 0;transform:translateY(105%);padding-bottom:env(safe-area-inset-bottom,0px)}#panel.open{transform:none}#lede{font-size:28px}}
.pin{padding:20px max(20px,env(safe-area-inset-right,0px)) 24px max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.where{font-size:13px;color:var(--ink-3);font-weight:600}
.close{font:inherit;border:1px solid var(--rule);background:none;color:var(--ink);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:18px;line-height:1}
.hero{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:center}
.hero svg{width:96px;height:96px}
.big{font-size:44px;font-weight:750;font-variation-settings:"wdth" 80;line-height:1;margin:0;overflow-wrap:anywhere}
.big.d{font-family:var(--deva);font-size:42px;line-height:1.25}
.alt{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.alt div{display:flex;gap:8px;align-items:baseline;font-size:15px}
.alt span{font-size:12px;color:var(--ink-3);font-weight:600;min-width:62px}
.alt .missing{color:var(--ink-3);font-weight:400}
.ask{border:1.5px dashed var(--rule);border-radius:12px;padding:14px;font-size:14px;line-height:1.45;color:var(--ink-2)}
.ask b{color:var(--ink)}

.nbs{display:flex;flex-wrap:wrap;gap:6px}
.nbs button{font:inherit;font-size:14px;font-weight:600;padding:6px 11px;border-radius:999px;border:1px solid var(--rule);background:none;color:var(--ink);cursor:pointer;min-height:34px}
.fact{font-size:15px;line-height:1.45}
.fact small{display:block;color:var(--ink-3);font-size:12px;margin-top:3px}
.foot{font-size:11px;color:var(--ink-3);line-height:1.4}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

function talName(t,m){ if(m==='deva'&&t.deva) return t.deva; if(m==='romi'&&t.romi) return t.romi; return t.official; }

function paint(){
  let have=0;
  D.villages.forEach(v=>{
    const n=nodes[v.id], nm=nameOf(v,mode); if(nm.real&&mode!=='off') have++;
    n.tx.textContent=nm.s; n.tx.classList.toggle('faint',!nm.real);
    n.tx.style.fontFamily=(mode==='deva'&&nm.real)?'var(--deva)':'';
    const written=!!(v.deva||v.romi);
    let fill=tv(n.h), txt=hv(n.h), op=1, lab=(nm.real||mode==='off')?1:.42, faint=!nm.real;
    if(lens==='ends'){ const m=!!ending&&v.n.toLowerCase().endsWith(ending);
      fill=m?'var(--ink)':'var(--quiet)'; txt=m?'var(--paper)':'var(--ink-3)'; lab=m?1:.45; }
    if(lens==='gaps'){ fill=written?'var(--kokum)':'var(--quiet)'; txt=written?'var(--paper)':'var(--ink-3)'; lab=written?1:.5; faint=!written; }
    if(sel){ const on=v.id===sel.id||sel.nb.includes(v.id); op=on?1:.35; lab=on?Math.max(lab,.9):lab*.5; }
    n.p.style.fill=fill; n.p.style.opacity=op; n.tx.style.fill=txt; n.tx.classList.toggle('faint',faint); n.tx.dataset.base=lab;
    n.p.classList.toggle('sel',!!sel&&v.id===sel.id);
  });
  gTL.querySelectorAll('text').forEach(tx=>{tx.textContent=talName(TAL[tx.dataset.id],mode);tx.style.fontFamily=mode==='deva'?'var(--deva)':'';});
  const c=$('#count'), L=$('#legend'); const W=D.villages.filter(v=>v.deva||v.romi).length;
  if(lens==='ends'){ const k=ending?D.villages.filter(v=>v.n.toLowerCase().endsWith(ending)).length:0;
    c.innerHTML= ending?`<b>${k} of ${N} villages</b> end in “-${ending}” in their official spelling.`:`Pick an ending to see which villages share it.`;
    L.innerHTML=ending?`<span class="key"><i style="background:var(--ink)"></i>ends in -${ending}</span><span class="key"><i style="background:var(--quiet);border:1px solid var(--rule)"></i>other villages</span>`:''; }
  else if(lens==='gaps'){ c.innerHTML=`<b>${W} of ${N} villages</b> have a Konkani name written here. The rest still show their official spelling.`;
    L.innerHTML=`<span class="key"><i style="background:var(--kokum)"></i>written in Konkani, ${W}</span><span class="key"><i style="background:var(--quiet);border:1px solid var(--rule)"></i>not yet, ${N-W}</span>`; }
  else { L.innerHTML='';
    if(mode==='off') c.innerHTML=`<b>${N} villages</b>, as the government spells them. Switch script to see how many we can write in Konkani yet.`;
    else c.innerHTML=`<b>${have} of ${N}</b> villages written in ${mode==='deva'?'Devanagari':'Romi'} so far. The faint names are still waiting for someone who knows them.`; }
  gR.style.opacity=lens==='names'?1:.3; gRL.style.opacity=lens==='names'?1:0;
  labels();
}

// endings
const ENDS=['im','em','gao','ona','ora'];
ENDS.forEach(e=>{const k=D.villages.filter(v=>v.n.toLowerCase().endsWith(e)).length;
  const b=document.createElement('button');b.className='chip';b.dataset.e=e;b.setAttribute('aria-pressed','false');b.innerHTML=`-${e} <span>${k}</span>`;
  b.onclick=()=>{ending=e;document.querySelectorAll('#ends .chip').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));if(sel)closePanel(true);paint();};
  $('#ends').appendChild(b);});
document.querySelectorAll('.seg button[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll('.seg button[data-m]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));paint();if(sel)openPanel(sel,false);});

document.querySelectorAll('.lens button').forEach(b=>b.onclick=()=>{lens=b.dataset.l;document.querySelectorAll('.lens button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
  $('#ends').hidden=lens!=='ends'; if(lens==='ends'&&!ending){ending='im';document.querySelectorAll('#ends .chip').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.e==='im')));}
  if(lens!=='ends'){ending=null;} paint();});
// view
let vw=0,vh=0,k=1,tx=0,ty=0,k0=1;
function panelW(){return innerWidth>=900?408:0}
function fit(){vw=innerWidth;vh=innerHeight;svg.setAttribute('viewBox',`0 0 ${vw} ${vh}`);
  const availW=vw-panelW(); k0=Math.min(availW/D.size[0], vh/D.size[1])*0.96; }
function apply(){world.setAttribute('transform',`translate(${tx} ${ty}) scale(${k})`);labels();}
function labels(){
  D.villages.forEach(v=>{const n=nodes[v.id]; const px=v.fs*k; const forced=sel&&(v.id===sel.id||sel.nb.includes(v.id));
    const vis = forced? 1 : (px>=7 ? Math.min(1,(px-7)/3+.35) : 0);
    n.tx.style.opacity = vis*(+n.tx.dataset.base||1);});
  rivNodes.forEach(p=>{p.style.strokeWidth=(+p.dataset.w*Math.max(.55,Math.min(1.6,k/k0/2.2)))/k*k0*1.0+'px';});
  const rz=k/k0; gRL.querySelectorAll('text').forEach(t=>{t.style.fontSize=(12/k)+'px';t.style.opacity=(rz>2.2&&lens==='names')?1:0;});
  const to=Math.max(0,Math.min(1,1-(k/k0-1.7)/1.2));
  gTL.querySelectorAll('text').forEach(t=>{t.style.opacity=sel?0:to; t.style.fontSize=(Math.max(15,Math.min(30,vw/30))/k)+'px'; t.style.strokeWidth=(4/k)+'px';});
}
function homeT(){const ph=innerWidth<900;const hk=ph?Math.min(vw/D.size[0],(vh*0.7)/D.size[1])*0.98:k0;let hx=(vw-panelW()-D.size[0]*hk)/2, hy=ph?vh-D.size[1]*hk-8:(vh-D.size[1]*hk)/2; if(innerWidth>=900){const left=450; hx=left+(vw-left-D.size[0]*hk)/2;} return [hk,hx,hy];}
function home(){[k,tx,ty]=homeT();}
let anim;
function animTo(nk,nx,ny,ms=650){cancelAnimationFrame(anim);const s={k,tx,ty},t0=performance.now();
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches; if(reduce){k=nk;tx=nx;ty=ny;apply();return;}
  const step=now=>{let p=Math.min(1,(now-t0)/ms);p=1-Math.pow(1-p,3);k=s.k+(nk-s.k)*p;tx=s.tx+(nx-s.tx)*p;ty=s.ty+(ny-s.ty)*p;apply();if(p<1)anim=requestAnimationFrame(step)};anim=requestAnimationFrame(step);}
function focusBox(b,pad=1.0){const phone=innerWidth<900; const aw=vw-panelW(), ah=phone?vh*0.42:vh;
  const top=phone?vh*0.0:0; const bw=(b[2]-b[0])*1.0, bh=(b[3]-b[1])*1.0;
  let nk=Math.min(aw/bw, ah/bh)*0.55*pad; nk=Math.min(nk,k0*14);
  const cx=(b[0]+b[2])/2, cy=(b[1]+b[3])/2; animTo(nk, aw/2-cx*nk, top+ah/2-cy*nk+(phone?vh*0.04:0));}

// interaction
const stage=$('#stage'); const pts=new Map(); let moved=false, last=null, pinch=null;
stage.addEventListener('pointerdown',e=>{stage.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);moved=false;last=[e.clientX,e.clientY];stage.classList.add('drag');
  if(pts.size===2){const [a,b]=[...pts.values()];pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]),k,tx,ty,cx:(a[0]+b[0])/2,cy:(a[1]+b[1])/2};}});
stage.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,[e.clientX,e.clientY]);
  if(pts.size===2&&pinch){const [a,b]=[...pts.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);const nk=Math.max(k0*.8,Math.min(k0*22,pinch.k*d/pinch.d));
    tx=pinch.cx-(pinch.cx-pinch.tx)*nk/pinch.k; ty=pinch.cy-(pinch.cy-pinch.ty)*nk/pinch.k; k=nk; moved=true; apply(); hideHint(); return;}
  const dx=e.clientX-last[0],dy=e.clientY-last[1]; if(Math.abs(dx)+Math.abs(dy)>3)moved=true; if(moved){tx+=dx;ty+=dy;apply();} last=[e.clientX,e.clientY];});
const up=e=>{pts.delete(e.pointerId);if(pts.size<2)pinch=null;if(pts.size===0)stage.classList.remove('drag');
  if(!moved&&e.type==='pointerup'){const el=document.elementFromPoint(e.clientX,e.clientY); if(el&&el.dataset&&el.dataset.id&&VID[el.dataset.id]) select(VID[el.dataset.id]); else if(sel) closePanel();}};
stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
stage.addEventListener('wheel',e=>{e.preventDefault();cancelAnimationFrame(anim);const f=Math.exp(-e.deltaY*0.0016);const nk=Math.max(k0*.8,Math.min(k0*22,k*f));
  tx=e.clientX-(e.clientX-tx)*nk/k; ty=e.clientY-(e.clientY-ty)*nk/k; k=nk; apply(); hideHint();},{passive:false});
function hideHint(){$('#hint').style.opacity=0}

// panel
function outline(v){const b=v.b,w=b[2]-b[0],h=b[3]-b[1],s=Math.max(w,h),pad=s*.08;
  return `<svg viewBox="${b[0]+w/2-s/2-pad} ${b[1]+h/2-s/2-pad} ${s+2*pad} ${s+2*pad}" aria-hidden="true"><path d="${v.d}" fill="${hv(nodes[v.id].h)}"/></svg>`;}
function openPanel(v,zoom=true){
  const t=TAL[v.t], nm=nameOf(v,mode);
  const deva=v.deva, romi=v.romi;
  const head = (mode==='deva'&&deva)?`<p class="big d">${deva}</p>`:(mode==='romi'&&romi)?`<p class="big">${romi}</p>`:`<p class="big">${v.n}</p>`;
  const rows=`<div class="alt"><div><span>Official</span>${v.n}</div><div><span>देवनागरी</span>${deva?`<b style="font-family:var(--deva)">${deva}</b>`:'<i class="missing">not written yet</i>'}</div><div><span>Romi</span>${romi?`<b>${romi}</b>`:'<i class="missing">not written yet</i>'}</div></div>`;
  const f=(FACTS[v.n]||[]).map(([h,txt,src])=>`<div class="fact"><h3>${h}</h3>${txt}<small>${src}</small></div>`).join('');
  const ask=(!deva||!romi)?`<div class="ask"><b>Do you know how ${v.n} is said at home?</b> Record it or write it in either script, and it goes on the map with your name.</div>`:'';
  $('#pin').innerHTML=`<div class="ph"><div class="where">Village in ${t?t.official:''}</div><button class="close" aria-label="Close">×</button></div>
   <div class="hero">${outline(v)}<div>${head}${rows}</div></div>${ask}${f}
   <div><h3>Next to</h3><div class="nbs">${v.nb.map(id=>{const n=VID[id];const s=nameOf(n,mode);return `<button data-go="${id}" ${mode==='deva'&&s.real?'style="font-family:var(--deva)"':''}>${s.s}</button>`}).join('')}</div></div>
   <p class="foot">Prototype. Boundaries and official names: Local Government Directory, Government of India. Facts shown only where a source is named.</p>`;
  $('#pin .close').onclick=()=>closePanel();
  $('#pin').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>select(VID[b.dataset.go]));
  $('#panel').classList.add('open');
  if(zoom) focusBox(v.b);
}
function select(v){sel=v;document.body.classList.add('has-sel');hideHint();paint();openPanel(v);}
function closePanel(keep){sel=null;document.body.classList.remove('has-sel');$('#panel').classList.remove('open');paint();if(!keep){const [a,b,c]=homeT();animTo(a,b,c);}}
addEventListener('keydown',e=>{if(e.key==='Escape'&&sel)closePanel();});
addEventListener('resize',()=>{fit();if(!sel){home();k0=k;}apply();});
fit();home();k0=k;apply();paint();
document.fonts&&document.fonts.ready.then(()=>labels());
</script>
