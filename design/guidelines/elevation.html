<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 22px;background:var(--surface);color:var(--text);font:500 14px/1.45 var(--font-latin)}.cap{font:600 13px/1.3 var(--font-latin)}</style></head><body><div style="display:flex;gap:24px;padding:10px 4px"><div style="display:grid;gap:10px"><div style="width:120px;height:70px;border-radius:16px;background:var(--surface-raised);box-shadow:var(--shadow-1)"></div><span class="cap">shadow-1</span></div><div style="display:grid;gap:10px"><div style="width:120px;height:70px;border-radius:16px;background:var(--surface-raised);box-shadow:var(--shadow-2)"></div><span class="cap">shadow-2</span></div><div style="display:grid;gap:10px"><div style="width:120px;height:70px;border-radius:16px;background:var(--surface-raised);box-shadow:var(--shadow-3)"></div><span class="cap">shadow-3</span></div><div style="display:grid;gap:10px"><div style="width:120px;height:70px;border-radius:16px;background:var(--surface-raised);box-shadow:var(--shadow-sheet)"></div><span class="cap">shadow-sheet</span></div></div></body></html>
